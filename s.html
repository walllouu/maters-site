<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maters</title>
  <meta property="og:title" content="Rejoins ma session sur Maters">
  <meta property="og:description" content="Move. Mates. It Matters.">
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; height: 100%; background: #FBEDE3; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1F2750; display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    /* La carte reste cachée tant que le script n'a pas décidé (évite un flash avant redirection) */
    .card { display: none; width: 100%; max-width: 380px; }
    .brand {
      font-size: 30px; font-weight: 900; letter-spacing: 6px; margin-bottom: 28px;
      background: linear-gradient(90deg, #6B4FBB, #C85B8A, #FF7A3D);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: 1px; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 21px; color: rgba(31,39,80,0.65); margin: 0 0 28px; }
    .btn {
      display: block; padding: 18px; border-radius: 8px; text-decoration: none;
      font-size: 14px; font-weight: 900; letter-spacing: 2px;
    }
    .btn-main { color: #fff; background: linear-gradient(90deg, #6B4FBB, #C85B8A, #FF7A3D); }
    .btn-alt { color: #1F2750; margin-top: 12px; border: 1px solid rgba(31,39,80,0.15); font-size: 12px; }
    .hint { font-size: 12px; color: rgba(31,39,80,0.5); margin-top: 22px; line-height: 18px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">MATERS</div>
    <h1>Rejoins ma session</h1>
    <p id="msg">Ouvre la session dans l'app Maters pour voir les détails et t'inscrire.</p>
    <a class="btn btn-main" id="open" href="#">OUVRIR DANS MATERS</a>
    <a class="btn btn-alt" id="store" href="#">PAS ENCORE L'APP ? TÉLÉCHARGER</a>
    <a class="btn btn-alt" id="store2" href="#" style="display:none">TÉLÉCHARGER SUR ANDROID</a>
    <div class="hint" id="hint" style="display:none">
      Rien ne se passe ? Ouvre ce lien dans ton navigateur (menu ⋯ en haut de l'écran).
    </div>
  </div>

  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/fr/app/maters/id6768300932';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.runmars.app';
      var ua = navigator.userAgent || '';
      var id = new URLSearchParams(window.location.search).get('id');
      var validId = !!id && /^[A-Za-z0-9-]+$/.test(id);

      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      // Navigateurs intégrés aux apps (Messenger, Facebook, Instagram, LinkedIn, Snapchat, TikTok...) :
      // ils n'ouvrent jamais l'app via les liens universels, d'où cette page.
      var inApp = /FBAN|FBAV|FB_IAB|FBIOS|FB4A|Messenger|Instagram|LinkedInApp|Snapchat|TikTok|musical_ly|BytedanceWebview|Line\//i.test(ua);

      // Lien qui ouvre Maters directement sur la session
      var appUrl = null;
      if (validId) {
        appUrl = isAndroid
          // Android : lien « intent » ; si Maters n'est pas installée, Android ouvre le Play Store
          ? 'intent://session/' + encodeURIComponent(id)
            + '#Intent;scheme=maters;package=com.runmars.app;S.browser_fallback_url='
            + encodeURIComponent(PLAY_STORE) + ';end'
          : 'maters://session/' + encodeURIComponent(id);
      }

      function showCard() {
        var open = document.getElementById('open');
        var store = document.getElementById('store');
        if (appUrl) open.href = appUrl; else open.style.display = 'none';
        if (isAndroid) store.href = PLAY_STORE;
        else if (isIOS) store.href = APP_STORE;
        else {
          // Ordinateur : pas d'app à ouvrir, les deux stores
          open.style.display = 'none';
          store.href = APP_STORE;
          store.textContent = 'TÉLÉCHARGER SUR IPHONE';
          var store2 = document.getElementById('store2');
          store2.href = PLAY_STORE;
          store2.style.display = 'block';
          document.getElementById('msg').textContent = "Maters s'utilise sur téléphone : télécharge l'app pour rejoindre la session.";
        }
        if (inApp && appUrl) document.getElementById('hint').style.display = 'block';
        document.getElementById('card').style.display = 'block';
      }

      // ── Instagram sur iPhone : comportement d'avant, qui fonctionne bien ─────────
      // Instagram accepte l'ouverture automatique de l'app (avec une demande de
      // confirmation) ; si rien ne se passe, l'app est absente → App Store.
      if (inApp && isIOS && /Instagram/i.test(ua) && appUrl) {
        showCard();
        var opened = false;
        var promptShown = false;
        function goStore() {
          if (!opened && !document.hidden) window.location.replace(APP_STORE);
        }
        var fallback = setTimeout(function () { if (!promptShown) goStore(); }, 1500);
        function markOpened() { opened = true; clearTimeout(fallback); }
        document.addEventListener('visibilitychange', function () { if (document.hidden) markOpened(); });
        window.addEventListener('pagehide', markOpened);
        // Si une demande d'ouverture s'affiche, on attend la réponse
        window.addEventListener('blur', function () { promptShown = true; clearTimeout(fallback); });
        window.addEventListener('focus', function () {
          if (promptShown && !opened) setTimeout(goStore, 700);
        });
        window.location.href = appUrl;
        return;
      }

      // ── Autres navigateurs intégrés (Messenger, Facebook, LinkedIn...) ───────────
      // Ils bloquent l'ouverture automatique de l'app : on affiche la page, et c'est
      // l'appui sur « OUVRIR DANS MATERS » qui lance l'app. On tente quand même une
      // ouverture automatique, mais sans rediriger d'office vers le store (c'est ce
      // qui empêchait d'ouvrir l'app depuis Messenger : la page partait sur l'App Store).
      // Sur Android, le lien « intent » bascule lui-même sur le Play Store si besoin.
      if (inApp) {
        showCard();
        if (appUrl) setTimeout(function () { window.location.href = appUrl; }, 300);
        return;
      }

      // ── Android (Chrome...) : ouverture directe, Play Store si l'app est absente ──
      if (isAndroid) {
        window.location.href = appUrl || PLAY_STORE;
        return;
      }

      // ── iOS (Safari, Messages, WhatsApp...) ──────────────────────────────────────
      // Si l'app était installée, iOS l'aurait ouverte directement : on arrive ici
      // parce qu'elle est absente → App Store.
      if (isIOS) {
        window.location.replace(APP_STORE);
        return;
      }

      // ── Ordinateur ───────────────────────────────────────────────────────────────
      showCard();
    })();
  </script>
</body>
</html>
