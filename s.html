<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maters</title>
  <meta property="og:title" content="Rejoins-moi sur Maters">
  <meta property="og:description" content="Move. Mates. It Matters.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maters">
  <meta property="og:image" content="https://maters.fr/og-image-v3.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Maters — Move. Mates. It Matters.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://maters.fr/og-image-v3.png">
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; height: 100%; background: #FBEDE3; }
    /* Aide pour les navigateurs intégrés qui bloquent l'ouverture de l'app (Messenger...) */
    .help {
      position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      margin: 0; padding: 0 32px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px; line-height: 19px; color: rgba(31,39,80,0.45);
    }
  </style>
</head>
<body>
  <p class="help">Si rien ne s'affiche, appuie sur « ⋯ » puis « Ouvrir dans un navigateur externe ».</p>
  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/fr/app/maters/id6768300932';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.runmars.app';
      var ua = navigator.userAgent;
      // Lien de session (?id=...) ou de profil (?id=...&profil=1, ou ancien ?p=...) : même page,
      // même chemin /s et même paramètre id, reconnus par l'iPhone (apple-app-site-association)
      var params = new URLSearchParams(window.location.search);
      var profileId = params.get('p') || (params.get('profil') === '1' ? params.get('id') : null);
      var id = profileId || params.get('id');
      var validId = id && /^[A-Za-z0-9-]+$/.test(id);
      // Écran à ouvrir dans l'app : maters://profile/... ou maters://session/...
      var target = (profileId ? 'profile/' : 'session/') + encodeURIComponent(id || '');

      // ── ANDROID ──────────────────────────────────────────────
      // Lien "intent" : Android ouvre Maters sur la session si elle est installée,
      // sinon il bascule lui-même sur la fiche Play Store (browser_fallback_url).
      if (/Android/i.test(ua)) {
        if (!validId) { window.location.replace(PLAY_STORE); return; }
        // Filet de sécurité : certains navigateurs (Firefox, navigateurs intégrés à des
        // applis) ne gèrent pas les liens "intent". Si au bout de 2,5 s la page est
        // toujours affichée (ni l'app ni le Play Store ne se sont ouverts), on redirige
        // nous-mêmes vers le Play Store.
        var androidFallback = setTimeout(function () {
          if (!document.hidden) window.location.replace(PLAY_STORE);
        }, 2500);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) clearTimeout(androidFallback);
        });
        window.location.href = 'intent://' + target
          + '#Intent;scheme=maters;package=com.runmars.app;S.browser_fallback_url='
          + encodeURIComponent(PLAY_STORE) + ';end';
        return;
      }

      // ── iOS ──────────────────────────────────────────────────
      // Navigateurs intégrés d'Instagram / Facebook : ils bloquent les Universal Links,
      // donc on arrive ici même si l'app est installée.
      var inAppBrowser = /Instagram|FBAN|FBAV/i.test(ua);

      // Partout ailleurs (Safari, Messages, WhatsApp...) : si l'app était installée,
      // iOS l'aurait ouverte directement. On arrive ici = app absente → App Store.
      if (!inAppBrowser || !validId) {
        window.location.replace(APP_STORE);
        return;
      }

      // Dans Instagram / Facebook : on tente d'ouvrir l'app sur la session,
      // et on bascule sur l'App Store si rien ne se passe.
      var opened = false;
      var promptShown = false;

      function goStore() {
        if (!opened && !document.hidden) window.location.replace(APP_STORE);
      }

      var fallback = setTimeout(function () {
        if (!promptShown) goStore();
      }, 1500);

      function markOpened() { opened = true; clearTimeout(fallback); }
      document.addEventListener('visibilitychange', function () { if (document.hidden) markOpened(); });
      window.addEventListener('pagehide', markOpened);

      // Si une demande d'ouverture s'affiche, on attend la réponse
      window.addEventListener('blur', function () { promptShown = true; clearTimeout(fallback); });
      window.addEventListener('focus', function () {
        if (promptShown && !opened) setTimeout(goStore, 700);
      });

      window.location.href = 'maters://' + target;
    })();
  </script>
</body>
</html>
